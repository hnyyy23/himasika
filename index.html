<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Kesekretariatan HIMASIKA ITS — Kabinet Zain</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:#f1f4f9;color:#0f172a}
header{background:#0f294a;color:#fff;border-bottom:3px solid #d97706;padding:10px 16px;display:none;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header small{color:#fcd34d}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:#ffffff1f;color:#fff;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:#1d4ed8}
main{max-width:1200px;margin:16px auto;padding:0 12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:3px 0 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd}
label{font-weight:600;font-size:12px;color:#334155}
.btn{background:#1d4ed8;color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font:600 13px inherit}
.btn.g{background:#d97706}.btn.r{background:#dc2626}.btn.s{background:#e2e8f0;color:#0f172a}
.t{width:100%;border-collapse:collapse}
.t th,.t td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}
.t th{font-size:12px;color:#64748b}
.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:14px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.bd{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.ok{background:#d1fae5;color:#065f46}.wt{background:#fef3c7;color:#92400e}.rv{background:#ffe4e6;color:#9f1239}
.login{max-width:420px;margin:8vh auto}
#toast{position:fixed;bottom:14px;right:14px;background:#0f294a;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90vw}
.wrap{overflow:auto;background:#cbd5e1;border-radius:12px;padding:10px}
.sheet{background:#fff;color:#000;font:12pt/1.35 "Times New Roman",serif;padding:2.54cm;width:210mm;min-height:297mm;box-shadow:0 4px 20px #0003;margin:0 auto 16px;zoom:.6}
.sheet p{text-align:justify;margin:0 0 8pt}
.kv td{padding:1pt 6pt 1pt 0;vertical-align:top}.kv td:first-child{width:85pt}
.lt{width:100%;border-collapse:collapse}.lt td,.lt th{border:1px solid #000;padding:3pt 5pt}.lt th{background:#f3f4f6}
.hl{background:#fef08a;font-weight:bold}.pb{page-break-before:always}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
@media print{@page{size:A4;margin:2.54cm}body *{visibility:hidden}.wrap,.wrap *{visibility:visible}.wrap{position:absolute;left:0;top:0;padding:0;background:none;overflow:visible}.sheet{zoom:1!important;padding:0;box-shadow:none;width:auto;min-height:0;margin:0}}
</style>
</head>
<body>
<header id="hd"><b>Portal HIMASIKA ITS</b><small id="who"></small><nav id="nv"></nav><button class="btn s" onclick="showLogin()">Keluar</button></header>
<main id="app"></main>
<div id="toast"></div>
<script>
const KAB='Kabinet Zain',KEY='zain_portal_v1';
const KAHIMA={n:'Safia Melati Dewi',nrp:'5001231064'},KAPRODI={n:'Dr. Suyatno, M.Si.',nip:'19760620 200212 1 004'};
const DEPT={DAGRI:'Departemen Dalam Negeri',HUBLU:'Departemen Hubungan Luar',MEDFO:'Departemen Media & Informasi',PSDM:'Departemen Pengembangan SDM',RISTEK:'Departemen Riset & Teknologi',KWU:'Departemen Kewirausahaan',KESMA:'Departemen Kesejahteraan Mahasiswa',KOMINFO:'Departemen Komunikasi & Informasi',PS:'BSO Physics Summit','BSO-LAB':'BSO Lab / Keilmuan',SEKUM:'Biro Kesekretariatan',BPH:'BPH Inti'};
const RN={admin:'Admin',sekdep:'Sekretaris',bendahara:'Bendahara'};
const NAV={admin:[['rekap','Rekap & ACC'],['buat','Buat Surat'],['links','Kelola Link'],['akun','Akun'],['keu','RAB & SPJ']],sekdep:[['buat','Buat Surat'],['rekap','Surat Departemen'],['links','Link & SOP']],bendahara:[['links','Link & SOP'],['keu','RAB & SPJ']]};
const RM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const JS={
'IK':{n:'Surat Izin Keramaian',p:'Surat Izin Keramaian',l:'-',x:['tuj'],s:'kk'},
'PR-DP':{n:'Peminjaman Ruangan Departemen (PAGU)',p:'Permohonan Peminjaman Tempat',l:'1 (Satu) Lembar',x:['multi','run'],s:'kp',r:1},
'PR-DNP':{n:'Peminjaman Ruangan Departemen (NO PAGU)',p:'Permohonan Peminjaman Tempat',l:'1 (Satu)',x:['desc','pjn','pjr','pjw','run'],s:'kp',r:1},
'PR-LD':{n:'Peminjaman Ruangan Luar Departemen',p:'Permohonan Surat Pengantar Peminjaman Tempat',l:'1 (Satu)',x:['ke','run'],s:'kp',r:1},
'PR-SKPB':{n:'Peminjaman Ruangan SKPB',p:'Permohonan Surat Pengantar Peminjaman Tempat',l:'1 (Satu)',x:['run'],s:'kp',r:1},
'PR-BMA':{n:'Peminjaman Ruangan BMA',p:'Permohonan Surat Pengantar Peminjaman Tempat',l:'1 (satu) lembar',x:['run'],s:'kp',r:1},
'PB-D':{n:'Peminjaman Barang Departemen',p:'Permohonan Peminjaman Alat',l:'1 (Satu) Lembar',x:['desc','dur','eq','run'],s:'kp',r:1},
'PB-H':{n:'Peminjaman Barang Himpunan',p:'Permohonan Peminjaman Alat',l:'1 (Satu) Lembar',x:['desc','dur','eq','run'],s:'k1',r:1},
'UND-KH':{n:'Undangan Sambutan oleh Kahima',p:'Undangan',l:'1 (satu)',x:['desc','kdn','kdr','run'],s:'kd',r:1},
'SP-SERT':{n:'Surat Pengantar Sertifikat',p:'Surat Pengantar Sertifikat',l:'1 (satu)',x:['kat','canva','sert'],s:'kp'}};
const FL={acara:['Nama kegiatan'],tgl:['Hari, tanggal kegiatan','','Sabtu, 28 November 2026'],wkt:['Pukul','','08.00 - 15.00 WIB'],tmp:['Tempat / ruangan','','J-102 dan J-103'],
tuj:['Tujuan surat (satu per baris)','t','Himpunan Mahasiswa Kimia (HIMKA) ITS\nHimpunan Mahasiswa Biologi (HIMABIO) ITS'],
multi:['Jadwal multi-hari (opsional): hari, tanggal | pukul | ruangan','t','Sabtu, 28 November 2026 | 07.00 - 14.00 WIB | J-102\nMinggu, 29 November 2026 | 08.00 - 15.00 WIB | J-103'],
run:['Susunan acara (Lampiran 1): mulai | selesai | kegiatan | tempat | keterangan','t','07.00 | 08.00 | Persiapan Panitia | J-103 | MC, Panitia\n08.00 | 08.15 | Sambutan Ketua Himpunan | J-103 | Safia Melati Dewi'],
desc:['Deskripsi kegiatan singkat'],ke:['Ditujukan kepada (instansi tujuan pengantar)','','Departemen Matematika'],dur:['Durasi peminjaman','','satu hari'],
eq:['Peralatan: nama | jumlah (satu per baris)','t','Proyektor | 1 buah\nSound System | 1 buah'],pjn:['Nama penanggung jawab'],pjr:['NRP penanggung jawab'],pjw:['No. WhatsApp penanggung jawab'],
kdn:['Nama Kepala Departemen'],kdr:['NRP Kepala Departemen'],kat:['Penerima sertifikat','','pemateri, panitia, dan peserta'],canva:['Link desain sertifikat Canva (wajib SOP)'],
sert:['Daftar penerima: no. sertifikat | nama | peran','t','001/SERT/RISTEK/HIMASIKA-ITS/XI/2026 | Nama Penerima | Peserta'],
kn:['Nama ketua pelaksana'],kr:['NRP ketua pelaksana'],cp:['Contact person','','0812 3456 7890 (Nama)'],tsur:['Tanggal surat']};
const now=new Date();
const DEF={jn:'PR-DP',dp:'RISTEK',rom:RM[now.getMonth()],tsur:now.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),acara:'',tgl:'',wkt:'',tmp:'',tuj:'',multi:'',run:'',desc:'',ke:'',dur:'satu hari',eq:'',pjn:'',pjr:'',pjw:'',kdn:'',kdr:'',kat:'pemateri, panitia, dan peserta',canva:'',sert:'',kn:'',kr:'',cp:''};
const SEED=()=>({users:[{id:'u0',name:'Salwa',role:'admin',dept:'SEKUM',h:'a39ceda56d915156ffafe3df36c15c7dabc80e6c565ceb4f44ca0c2688e779d0'}],
links:[{id:'l1',t:'SOP Peminjaman Sekretariat',u:'https://its.id/m/SOPPeminjamanSekreKontribusiNyata2026',c:'Sarpras',r:'sekdep'},
{id:'l2',t:'Jadwal Reservasi Ruangan SKPB / BMA',u:'https://facility.its.ac.id/jadwal-reservasi',c:'Sarpras',r:'sekdep'},
{id:'l3',t:'PPT Pencerdasan Administrasi',u:'https://canva.link/tooh1yoh5g9uypv',c:'Materi',r:'sekdep'},
{id:'l4',t:'PPT Pencerdasan Keuangan (PdKT)',u:'https://canva.link/0vq0uq7jcfe3wnj',c:'Keuangan',r:'both'},
{id:'l5',t:'Pengumpulan Proposal, LPJ & SPJ ACC',u:'https://its.id/m/PengumpulanFileProposal-LPJ-SPJ',c:'Keuangan',r:'both'},
{id:'l6',t:'Konfirmasi Kas Himasika',u:'https://its.id/m/KasHimasika2026',c:'Keuangan',r:'both'}],rekap:[],keu:[],counter:1});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||SEED();
let U=null,V='',CUR={},PRE=null;
const $=i=>document.getElementById(i),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(T.x);T.x=setTimeout(()=>t.style.display='none',3200)};
const H=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const opt=(o,s)=>Object.entries(o).map(([k,v])=>`<option value="${k}"${k==s?' selected':''}>${E(v)}</option>`).join('');
const pad=n=>String(n).padStart(3,'0');

/* ---------- LOGIN & NAV ---------- */
function showLogin(){U=null;$('hd').style.display='none';$('app').innerHTML=`<div class="card login"><h2 style="margin:0;color:#0f294a">Portal Kesekretariatan</h2><p style="color:#64748b;margin:2px 0 16px">HIMASIKA ITS • ${KAB}</p>
<label>Masuk sebagai</label><select id="lr" onchange="$('ld').style.display=this.value=='admin'?'none':'block'"><option value="admin">Admin</option><option value="sekdep">Sekretaris Departemen / BSO</option><option value="bendahara">Bendahara Departemen / BSO</option></select>
<div id="ld" style="display:none"><label>Departemen / BSO</label><select id="ldp">${opt(DEPT)}</select></div>
<label>Kode akses</label><input id="lc" type="password" onkeydown="if(event.key=='Enter')doLogin()"><button class="btn" style="width:100%" onclick="doLogin()">Masuk</button>
<p style="font-size:12px;color:#64748b;margin:12px 0 0">Belum punya kode? Minta ke Admin (Sekum).</p></div>`}
async function doLogin(){const r=$('lr').value,d=$('ldp').value,h=await H($('lc').value);
const u=S.users.find(x=>x.role==r&&x.h==h&&(r=='admin'||x.dept==d));if(!u)return T('Kode akses salah atau akun belum dibuat.');
U=u;CUR={dp:u.role=='admin'?'RISTEK':u.dept};PRE=null;V=NAV[u.role][0][0];render();T('Selamat datang, '+u.name)}
const go=v=>{V=v;render()};
function render(){$('hd').style.display='flex';$('who').textContent=`${U.name} • ${RN[U.role]}${U.role!='admin'?' • '+DEPT[U.dept]:''}`;
$('nv').innerHTML=NAV[U.role].map(([k,l])=>`<button class="${V==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
$('app').innerHTML=VW[V]();if(V=='buat')pv()}
const VW={};

/* ---------- REKAP ---------- */
const bd=r=>r.st=='ok'?'<span class="bd ok">ACC & Terbit</span>':r.st=='rv'?`<span class="bd rv">Perlu Revisi</span><br><small>${E(r.note)}</small>`:'<span class="bd wt">Menunggu ACC</span>';
VW.rekap=()=>{const a=U.role=='admin',L=S.rekap.filter(r=>a||r.dept==U.dept).slice().reverse();
return `<div class="card">${a?`<div class="row"><div><label>Nomor urut berikutnya</label><input id="ctr" type="number" min="1" value="${S.counter}" style="width:120px"></div><button class="btn s" style="margin-bottom:10px" onclick="setCtr()">Simpan</button><button class="btn g" style="margin-bottom:10px" onclick="csv()">Export CSV</button></div>`:''}
<table class="t"><tr><th>Nomor</th><th>Kegiatan & tujuan</th><th>Status</th><th></th></tr>${L.map(r=>`<tr><td><b>${E(r.no)}</b></td><td>${E(r.acara)}<br><small>${E(r.tujuan)}</small></td><td>${bd(r)}</td><td>
<button class="btn s" onclick="openR('${r.id}')">Buka</button>${a?` <button class="btn" onclick="st('${r.id}','ok')">ACC</button> <button class="btn r" onclick="st('${r.id}','rv')">Revisi</button> <button class="btn s" onclick="del('${r.id}')">Hapus</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada surat. Buat surat pertama di tab Buat Surat.</td></tr>'}</table></div>`};
function st(id,s){const r=S.rekap.find(x=>x.id==id);let n='';if(s=='rv'){n=prompt('Catatan revisi untuk Sekretaris:');if(n===null)return}r.st=s;r.note=n;save();render()}
function del(id){if(confirm('Hapus nomor surat ini?')){S.rekap=S.rekap.filter(x=>x.id!=id);save();render()}}
function setCtr(){const v=parseInt($('ctr').value);if(!(v>=1))return T('Angka tidak valid.');S.counter=v;save();T('Counter diatur ke #'+pad(v))}
function openR(id){PRE=S.rekap.find(x=>x.id==id);CUR={...PRE.d};go('buat')}
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',h=['Nomor','Dept','Jenis','Kegiatan','Tujuan','Status','Catatan'];
dl('Rekap_Nomor_Surat.csv','\ufeff'+[h,...S.rekap.map(r=>[r.no,r.dept,r.jn,r.acara,r.tujuan,r.st=='ok'?'ACC & Terbit':r.st=='rv'?'Perlu Revisi':'Menunggu ACC',r.note])].map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
function dl(n,c,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t+';charset=utf-8'}));a.download=n;a.click();URL.revokeObjectURL(a.href)}

/* ---------- LINK (dikelola Admin) ---------- */
VW.links=()=>{const a=U.role=='admin',L=S.links.filter(l=>a||l.r=='both'||l.r==U.role),cats=[...new Set(L.map(l=>l.c))];
return `${a?`<div class="card"><b>Tambah link baru</b><div class="row" style="margin-top:8px"><div style="flex:2;min-width:180px"><label>Judul</label><input id="lt"></div><div style="flex:3;min-width:220px"><label>URL</label><input id="lu" placeholder="https://"></div><div style="flex:1;min-width:120px"><label>Kategori</label><input id="lk" placeholder="Keuangan"></div><div style="flex:1;min-width:140px"><label>Tampil untuk</label><select id="lv"><option value="both">Sekretaris & Bendahara</option><option value="sekdep">Sekretaris saja</option><option value="bendahara">Bendahara saja</option></select></div><button class="btn" style="margin-bottom:10px" onclick="addLink()">Tambah</button></div></div>`:''}
${cats.map(c=>`<div class="card"><b>${E(c)}</b><table class="t">${L.filter(l=>l.c==c).map(l=>`<tr><td><a href="${E(l.u)}" target="_blank" rel="noopener">${E(l.t)}</a>${a?`<br><small style="color:#64748b">${E(l.u)} • untuk: ${l.r}</small>`:''}</td>${a?`<td style="text-align:right;white-space:nowrap"><button class="btn s" onclick="editLink('${l.id}')">Edit</button> <button class="btn r" onclick="delLink('${l.id}')">Hapus</button></td>`:''}</tr>`).join('')}</table></div>`).join('')||'<div class="card">Belum ada link. Admin akan menambahkannya di sini.</div>'}`};
function addLink(){const t=$('lt').value.trim(),u=$('lu').value.trim();if(!t||!/^https?:\/\//.test(u))return T('Isi judul dan URL (diawali https://).');
S.links.push({id:'l'+Date.now(),t,u,c:$('lk').value.trim()||'Umum',r:$('lv').value});save();render();T('Link ditambahkan.')}
function editLink(id){const l=S.links.find(x=>x.id==id),t=prompt('Judul:',l.t);if(t===null)return;const u=prompt('URL:',l.u);if(u===null)return;l.t=t;l.u=u;save();render()}
function delLink(id){if(confirm('Hapus link ini?')){S.links=S.links.filter(x=>x.id!=id);save();render()}}

/* ---------- AKUN ---------- */
VW.akun=()=>`<div class="card"><b>Buat akun</b><div class="row" style="margin-top:8px"><div><label>Nama</label><input id="an"></div><div><label>Role</label><select id="ar"><option value="sekdep">Sekretaris</option><option value="bendahara">Bendahara</option><option value="admin">Admin</option></select></div><div><label>Departemen / BSO</label><select id="ad">${opt(DEPT)}</select></div><div><label>Kode akses</label><input id="ac"></div><button class="btn" style="margin-bottom:10px" onclick="addUser()">Buat</button></div></div>
<div class="card"><table class="t"><tr><th>Nama</th><th>Role</th><th>Departemen</th><th></th></tr>${S.users.map(u=>`<tr><td>${E(u.name)}</td><td>${RN[u.role]}</td><td>${u.role=='admin'?'-':E(DEPT[u.dept])}</td><td style="text-align:right"><button class="btn s" onclick="resetCode('${u.id}')">Ganti kode</button> ${u.id!=U.id?`<button class="btn r" onclick="delUser('${u.id}')">Hapus</button>`:''}</td></tr>`).join('')}</table></div>`;
async function addUser(){const n=$('an').value.trim(),c=$('ac').value;if(!n||c.length<6)return T('Isi nama dan kode akses (minimal 6 karakter).');
S.users.push({id:'u'+Date.now(),name:n,role:$('ar').value,dept:$('ad').value,h:await H(c)});save();render();T('Akun dibuat. Berikan kodenya ke yang bersangkutan.')}
async function resetCode(id){const c=prompt('Kode akses baru (minimal 6 karakter):');if(!c||c.length<6)return;S.users.find(x=>x.id==id).h=await H(c);save();T('Kode diganti.')}
function delUser(id){if(confirm('Hapus akun ini?')){S.users=S.users.filter(x=>x.id!=id);save();render()}}

/* ---------- RAB & SPJ ---------- */
const KS=['Belum','Disusun','Diajukan','ACC'];
VW.keu=()=>{const a=U.role=='admin',L=S.keu.filter(k=>a||k.dept==U.dept);
return `<div class="card"><b>Tambah proker</b><div class="row" style="margin-top:8px">${a?`<div><label>Departemen</label><select id="kd">${opt(DEPT,'RISTEK')}</select></div>`:''}<div style="flex:1;min-width:200px"><label>Nama proker</label><input id="kp"></div><button class="btn" style="margin-bottom:10px" onclick="addKeu()">Tambah</button></div></div>
<div class="card"><table class="t"><tr>${a?'<th>Dept</th>':''}<th>Proker</th><th>RAB</th><th>SPJ</th><th></th></tr>${L.map(k=>`<tr>${a?`<td>${k.dept}</td>`:''}<td>${E(k.pk)}</td>${['rab','spj'].map(f=>`<td><select onchange="setKeu('${k.id}','${f}',this.value)">${KS.map(s=>`<option${s==k[f]?' selected':''}>${s}</option>`).join('')}</select></td>`).join('')}<td><button class="btn s" onclick="delKeu('${k.id}')">Hapus</button></td></tr>`).join('')||`<tr><td colspan="5">Belum ada proker. Tambahkan di atas.</td></tr>`}</table></div>`};
function addKeu(){const p=$('kp').value.trim();if(!p)return T('Isi nama proker.');S.keu.push({id:'k'+Date.now(),dept:U.role=='admin'?$('kd').value:U.dept,pk:p,rab:'Belum',spj:'Belum'});save();render()}
function setKeu(id,f,v){S.keu.find(x=>x.id==id)[f]=v;save()}
function delKeu(id){if(confirm('Hapus proker ini?')){S.keu=S.keu.filter(x=>x.id!=id);save();render()}}

/* ---------- BUAT SURAT ---------- */
const fld=(k,v)=>{const f=FL[k];return `<label>${f[0]}</label>${f[1]=='t'?`<textarea rows="4" placeholder="${E(f[2]||'')}" oninput="CUR.${k}=this.value;pv()">${E(v)}</textarea>`:`<input value="${E(v)}" placeholder="${E(f[2]||'')}" oninput="CUR.${k}=this.value;pv()">`}`};
VW.buat=()=>{const d={...DEF,...CUR},J=d.jn,x=['acara',...(J=='SP-SERT'?[]:['tgl','wkt','tmp']),...JS[J].x,'kn','kr','cp','tsur'];
return `<div class="grid"><div class="card"><div class="row" style="justify-content:space-between"><b>Formulir surat</b>${PRE?`<button class="btn s" onclick="PRE=null;CUR={dp:CUR.dp};go('buat')">Buat baru</button>`:''}</div>
<label>Jenis surat</label><select onchange="CUR.jn=this.value;go('buat')">${Object.entries(JS).map(([k,v])=>`<option value="${k}"${k==J?' selected':''}>${v.n} [${k}]</option>`).join('')}</select>
<label>Departemen / BSO pengaju</label><select ${U.role=='admin'?'':'disabled'} onchange="CUR.dp=this.value;pv()">${opt(DEPT,d.dp)}</select>
<label>Bulan (angka romawi pada nomor surat)</label><select onchange="CUR.rom=this.value;pv()">${RM.map(r=>`<option${r==d.rom?' selected':''}>${r}</option>`).join('')}</select>
${x.map(k=>fld(k,d[k])).join('')}
<button class="btn g" style="width:100%" onclick="pub()">${U.role=='admin'?'Terbitkan & langsung ACC':'Simpan & ambil nomor surat'}</button></div>
<div><div class="card"><small>Nomor surat</small><div id="nh" style="font:700 15px monospace;word-break:break-all;margin:4px 0 10px"></div><div class="row"><button class="btn" onclick="doc()">Download .doc</button><button class="btn s" onclick="print()">Cetak / Simpan PDF</button></div></div><div class="wrap" id="pv"></div></div></div>`};
const TJ=d=>({'PB-H':'Ketua Himpunan Mahasiswa Fisika ITS','UND-KH':KAHIMA.n,'PR-LD':'Kepala Departemen Fisika ITS (pengantar ke '+d.ke+')','PR-SKPB':'Kepala Departemen Fisika ITS (pengantar ke SKPB)','PR-BMA':'Kepala Departemen Fisika ITS (pengantar ke BMA)'}[d.jn]||'Kepala Departemen Fisika ITS');
function items(d){const tj=d.jn=='IK'?d.tuj.split('\n').map(s=>s.trim()).filter(Boolean):[TJ(d)];
return tj.map((t,i)=>({q:S.counter+i,tj:t,no:`${pad(S.counter+i)}/${d.jn}/${d.dp}/HIMASIKA-ITS/${d.rom}/2026`}))}
function pv(){const d={...DEF,...CUR},its=PRE?[{no:PRE.no,tj:PRE.tujuan}]:items(d);
$('nh').textContent=its.length?(its.length>1?its[0].no+'  …  '+its[its.length-1].no:its[0].no):'Isi tujuan surat dulu.';
$('pv').innerHTML=its.map((i,n)=>letter(d,i.no,i.tj,n>0)).join('')}
function pub(){const d={...DEF,...CUR};if(PRE)return T('Ini arsip surat. Klik "Buat baru" untuk surat baru.');
if(!d.acara.trim()||!d.kn.trim())return T('Isi nama kegiatan dan ketua pelaksana.');
if(d.jn=='SP-SERT'&&!d.canva.trim())return T('Wajib SOP: isi link Canva sertifikat.');
const its=items(d);if(!its.length)return T('Isi tujuan surat.');
its.forEach(i=>S.rekap.push({id:'r'+Date.now()+i.q,no:i.no,jn:d.jn,dept:d.dp,acara:d.acara,tujuan:i.tj,d:{...d},st:U.role=='admin'?'ok':'wt',note:''}));
S.counter+=its.length;save();T(its.length+' nomor surat tersimpan: '+its[0].no);render()}

/* ---------- RENDER SURAT ---------- */
const kv=a=>'<table class="kv">'+a.map(([k,v])=>`<tr><td>${k}</td><td>:</td><td>${E(v)}</td></tr>`).join('')+'</table>';
const mn=s=>{const m=String(s).match(/(\d+)[.:](\d+)/);return m?+m[1]*60+ +m[2]:null};
const du=(a,b)=>{const x=mn(a),y=mn(b);if(x==null||y==null||y<x)return'';const k=y-x;return String(Math.floor(k/60)).padStart(2,'0')+':'+String(k%60).padStart(2,'0')};
const lines=s=>String(s).split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(r=>r[0]);
function letter(d,no,tj,pb){const J=d.jn,s=JS[J],dn=DEPT[d.dp],a=`<b>${E(d.acara)}</b>`,org=`Himpunan Mahasiswa Fisika (HIMASIKA) ITS ${KAB} periode 2026-2027`,
sch=kv([['hari, tanggal',d.tgl],[J=='IK'||J=='UND-KH'?'waktu':'pukul',d.wkt],['tempat',d.tmp]]),
thx='<p>Demikian surat permohonan ini kami sampaikan. Atas perhatian dan kerjasamanya, kami ucapkan terima kasih.</p>',
thxB='<p>Demikian surat permohonan ini kami sampaikan. Atas perhatian dan kerja sama Bapak, kami ucapkan terima kasih.</p>',
pengantar=(tuju)=>`<p>Sehubungan dengan pelaksanaan kegiatan ${a} yang diselenggarakan oleh ${org} yang akan dilaksanakan pada:</p>${sch}<p>demi kelancaran kegiatan tersebut, kami bermaksud memohon penerbitan <b>surat pengantar peminjaman ${E(d.tmp)}</b> yang ditujukan kepada <b>${tuju}</b> untuk pelaksanaan kegiatan ${a}.</p>`+thxB;
const rc=J=='IK'?[tj,'Institut Teknologi Sepuluh Nopember']:J=='PB-H'?['Ketua Himpunan Mahasiswa Fisika','Institut Teknologi Sepuluh Nopember','Surabaya']:J=='UND-KH'?[KAHIMA.n,'Ketua Himpunan Mahasiswa Fisika 2026/2027','Institut Teknologi Sepuluh Nopember']:J=='SP-SERT'?['Kepala Departemen Fisika ITS','Institut Teknologi Sepuluh Nopember']:['Kepala Departemen Fisika','Institut Teknologi Sepuluh Nopember'];
let body='';
if(J=='IK')body=`<p>Sehubungan dengan akan dilaksanakannya kegiatan ${a} oleh ${org} yang akan dilaksanakan pada:</p>${sch}<p>dengan ini kami bermaksud memberitahukan sekaligus memohon izin keramaian selama kegiatan berlangsung pada waktu dan tempat yang telah tercantum di atas.</p>`+thx;
else if(J=='PR-DP'){const m=lines(d.multi),jd=m.length?`<table class="lt" style="margin:6pt 0 8pt"><tr><th>Hari, Tanggal</th><th>Pukul</th><th>Tempat</th></tr>${m.map(r=>`<tr><td>${E(r[0])}</td><td>${E(r[1])}</td><td>${E(r[2])}</td></tr>`).join('')}</table>`:sch;
body=`<p>Sehubungan dengan pelaksanaan kegiatan ${a} yang diselenggarakan oleh ${org} yang akan dilaksanakan pada:</p>${jd}<p>demi kelancaran kegiatan tersebut, kami bermaksud untuk memohon izin penggunaan ruang <b>${E(d.tmp)}</b> beserta seluruh fasilitas yang tersedia di dalamnya guna menunjang pelaksanaan kegiatan ${a}.</p>`+thxB}
else if(J=='PR-DNP')body=`<p>Sehubungan dengan pelaksanaan kegiatan <b>“${E(d.acara)}”</b> yang merupakan salah satu program kerja ${E(dn)} Himpunan Mahasiswa Fisika (HIMASIKA) ITS ${KAB} Periode 2026–2027, kami bermaksud untuk mengajukan permohonan peminjaman tempat guna menunjang pelaksanaan kegiatan tersebut. Adapun kegiatan tersebut bertujuan untuk ${E(d.desc)}.</p><p>Kegiatan tersebut akan dilaksanakan pada:</p>${kv([['hari, tanggal',d.tgl],['pukul',d.wkt],['tempat',d.tmp]])}<p>Penanggung jawab kegiatan:</p>${kv([['Nama',d.pjn],['NRP',d.pjr],['No. WhatsApp',d.pjw]])}<p>Demikian surat permohonan peminjaman tempat ini kami sampaikan. Besar harapan kami agar permohonan ini dapat disetujui demi kelancaran kegiatan yang akan dilaksanakan. Atas perhatian dan kerjasamanya, kami ucapkan terima kasih.</p>`;
else if(J=='PR-LD')body=`<p>Sehubungan dengan kegiatan ${a} yang diselenggarakan oleh ${org} yang akan dilaksanakan pada:</p>${sch}<p>Dalam rangka menunjang kelancaran pelaksanaan kegiatan tersebut, kami bermaksud memohon penerbitan <b>surat pengantar peminjaman tempat</b> yang ditujukan kepada <b>${E(d.ke)}</b> untuk pelaksanaan kegiatan ${a}.</p>`+thxB;
else if(J=='PR-SKPB')body=pengantar('Kepala Subdirektorat Koordinasi Perkuliahan Bersama');
else if(J=='PR-BMA')body=pengantar('Biro Manajemen Aset');
else if(J=='PB-D'||J=='PB-H')body=`<p>Sehubungan dengan kegiatan ${a} yang merupakan ${E(d.desc)} serta bagian dari program kerja ${E(dn)} Himpunan Mahasiswa Fisika (HIMASIKA) ITS ${KAB} Periode 2026–2027, yang akan dilaksanakan pada:</p>${sch}<p>Maka dengan diadakannya kegiatan tersebut, kami selaku panitia pelaksana bermaksud untuk mengajukan permohonan peminjaman alat untuk digunakan dalam kegiatan tersebut selama <b>${E(d.dur)}</b> terhitung sejak ${E(d.tgl)} sebagai berikut.</p><table class="lt" style="margin:6pt 0 10pt"><tr><th>No</th><th>Nama Peralatan</th><th>Jumlah</th></tr>${lines(d.eq).map((r,i)=>`<tr><td style="text-align:center">${i+1}</td><td>${E(r[0])}</td><td style="text-align:center">${E(r[1])}</td></tr>`).join('')}</table><p>Demikian surat permohonan ini kami buat, besar harapan kami agar kegiatan ini dapat berjalan dengan lancar. Atas perhatian dan kerjasama Bapak/Ibu, kami ucapkan terima kasih.</p>`;
else if(J=='UND-KH')body=`<p>Sehubungan dengan pelaksanaan kegiatan ${a} yang merupakan ${E(d.desc)} serta program kerja dari ${E(dn)} HIMASIKA ITS 2026, kami bermaksud mengundang Saudari untuk berkenan hadir sekaligus memberikan sambutan dalam pembukaan kegiatan tersebut yang akan dilaksanakan pada:</p>${sch}<p>Demikian surat undangan ini kami sampaikan. Atas perhatian dan kesediaan Saudari untuk hadir dalam kegiatan tersebut, kami ucapkan terima kasih.</p>`;
else body=`<p>Sehubungan dengan kegiatan ${a} kami dari panitia ${E(d.acara)} bermaksud membuat sertifikat kepada ${E(d.kat)} pada kegiatan ${a} yang telah dibentuk sebagai bentuk penghargaan. Maka kami mohon kesediaan Bapak untuk menandatangani sertifikat pada posisi Kepala Departemen Fisika ITS sebagaimana terlampir.</p><p>Link desain sertifikat (Canva): <u>${E(d.canva)}</u></p><p>Demikian surat pengantar ini kami sampaikan. Atas perhatian dan kerjasama Bapak, kami sampaikan terima kasih.</p>`;
const cell=(t,n,r)=>`<td style="text-align:center;vertical-align:top;width:50%">${t}<div style="height:50pt"></div><b><u>${E(n)}</u></b><br>NRP. ${E(r)}</td>`,
kt=cell(`Ketua Pelaksana ${E(d.acara)}<br>HIMASIKA ITS 2026`,d.kn,d.kr),kh=cell('Ketua Himpunan Mahasiswa Fisika ITS<br>Periode 2026',KAHIMA.n,KAHIMA.nrp),
kd=cell(`Kepala ${E(dn)}<br>Himpunan Mahasiswa Fisika ITS<br>Periode 2026`,d.kdn,d.kdr);
const sg=`<div style="text-align:center;margin:14pt 0 4pt">Hormat kami,</div><table style="width:100%;border-collapse:collapse"><tr>${s.s=='kd'?kd+kt:s.s=='k1'?'<td></td>'+kt:kh+kt}</tr></table>`+(s.s=='kp'?`<div style="text-align:center;margin-top:10pt">Mengetahui,<br>Kepala Program Studi<br>Sarjana Departemen Fisika ITS<div style="height:46pt"></div><b><u>${KAPRODI.n}</u></b><br>NIP. ${KAPRODI.nip}</div>`:'');
const cp=['IK','UND-KH','SP-SERT'].includes(J)||!d.cp?'':`<p style="font-size:11pt;margin-top:8pt">CP: ${E(d.cp)}</p>`;
const p1=`<div class="sheet${pb?' pb':''}"><div style="text-align:right;margin-bottom:8pt">Surabaya, ${E(d.tsur)}</div>${kv([['Nomor',no],['Lampiran',s.l],['Perihal',s.p]])}<p style="margin:10pt 0">Kepada Yth.${rc.map(x=>`<br><b>${E(x)}</b>`).join('')}<br>Di tempat</p><p>Dengan hormat,</p>${body}${sg}${cp}</div>`;
let lamp='';
if(J=='SP-SERT')lamp=`<div class="sheet pb"><b><i>Lampiran 1. Daftar Penerima Sertifikat</i></b>${kv([['Nomor',no],['Perihal','Surat Pengantar Sertifikat'],['Tanggal',d.tsur]])}<p style="margin-top:10pt"><b>Daftar Penerima Sertifikat</b></p><table class="lt"><tr><th>Nomor Sertifikat</th><th>Nama</th><th>Peran</th></tr>${lines(d.sert).map(r=>`<tr><td>${E(r[0])}</td><td>${E(r[1])}</td><td>${E(r[2])}</td></tr>`).join('')}</table></div>`;
else if(s.r)lamp=`<div class="sheet pb"><b><i>Lampiran 1</i></b><div style="text-align:center;font-weight:bold;margin:10pt 0">SUSUNAN ACARA<br>“${E(d.acara.toUpperCase())}”<br>${E(dn.toUpperCase())}<br>HIMPUNAN MAHASISWA FISIKA ITS<br>PERIODE 2026</div><p>Susunan Acara ${a} pada ${E(d.tgl)} adalah sebagai berikut.</p><table class="lt"><tr><th colspan="3">Waktu</th><th rowspan="2">Kegiatan</th><th rowspan="2">Tempat</th><th rowspan="2">Keterangan</th></tr><tr><th>Mulai</th><th>Selesai</th><th>Durasi</th></tr>${lines(d.run).map(r=>`<tr${J=='UND-KH'&&/sambutan\s*(ketua\s*himpunan|kahima)/i.test(r[2]||'')?' class="hl"':''}><td>${E(r[0])}</td><td>${E(r[1])}</td><td>${du(r[0],r[1])}</td><td>${E(r[2])}</td><td>${E(r[3])}</td><td>${E(r[4])}</td></tr>`).join('')}</table></div>`;
return p1+lamp}
function doc(){const css=`@page WS{size:21cm 29.7cm;margin:2.54cm}div.WS{page:WS}body{font:12pt "Times New Roman",serif}p{margin:0 0 8pt;text-align:justify}.lt{width:100%;border-collapse:collapse}.lt td,.lt th{border:1px solid #000;padding:3pt 5pt}.lt th{background:#f3f4f6}.hl{background:#FEF08A;font-weight:bold}.pb{page-break-before:always}.sheet{padding:0}`;
dl('Surat_'+$('nh').textContent.replace(/[^\w-]+/g,'_').slice(0,60)+'.doc','\ufeff<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>'+css+'</style></head><body><div class="WS">'+$('pv').innerHTML+'</div></body></html>','application/msword');T('File Word (margin 2,54 cm) diunduh.')}
showLogin();
